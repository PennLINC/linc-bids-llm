# Copy to config.yaml and adjust. config.yaml is gitignored; this file is the
# committed template. Expanding to another BIDS App = adding an entry under
# `apps` and re-ingesting — configuration, not code.

contact_email: you@example.edu     # goes in the crawl User-Agent (be reachable)

apps:
  qsiprep:
    github_repo: PennLINC/qsiprep
    blurb: "Preprocessing of diffusion MRI (dMRI)."
    docs_paths: [docs/]            # within the repo; rendered RTD not needed
    neurostars_tags: [qsiprep]
    neurostars_search: []          # extra search terms if tagging is spotty
    checkout_tags: 5               # latest N release tags + main
    neighbors: [qsirecon, qsiplan] # pipeline neighbors, retrieved alongside
    # `notes` correct known confusions the corpus/model gets wrong; they're
    # injected into the system prompt whenever this app is in scope.
    notes:
      - "qsiprep does DWI PREPROCESSING only. Reconstruction (tractography,
        scalar/ODF maps, connectivity) moved to the separate qsirecon package;
        current qsiprep does NOT do reconstruction and has no --recon-spec /
        --recon_input. A recon_spec.yaml is passed to qsirecon, not qsiprep.
        Send reconstruction/post-processing questions to qsirecon."

  qsirecon:
    github_repo: PennLINC/qsirecon
    blurb: "Reconstruction & tractography from QSIPrep outputs."
    docs_paths: [docs/]
    neurostars_tags: [qsirecon]
    neurostars_search: []
    checkout_tags: 5
    neighbors: [qsiprep]           # takes qsiprep's preprocessed outputs as input
    notes:
      - "qsirecon does RECONSTRUCTION / post-processing of qsiprep outputs
        (tractography, scalar maps, connectivity). It is the successor to
        qsiprep's old built-in --recon functionality; recon_spec.yaml and
        --recon-spec belong here, not in qsiprep."

  # QSIPlan (workflow planner, split into its own repo) is combined under the
  # hood with QSIPrep — the same way ModelArrayIO rides under ModelArray. It
  # plans/explains QSIPrep's dMRI preprocessing from BIDS metadata + flags;
  # future QSIPrep releases use it and mirror its docs. `hidden` (no card /
  # selector entry) but pulled into scope as a qsiprep neighbor so its
  # docs/issues are retrievable. New repo: docs live in the README, no
  # NeuroStars threads yet.
  qsiplan:
    github_repo: PennLINC/QSIPlan
    docs_paths: [docs/]            # no docs/ dir yet; top-level README rides along
    neurostars_tags: []
    neurostars_search: []
    checkout_tags: 5
    neighbors: [qsiprep]
    hidden: true                   # part of the QSIPrep tool, not its own card

  aslprep:
    github_repo: PennLINC/aslprep
    blurb: "Preprocessing of arterial spin labeling (ASL) MRI."
    docs_paths: [docs/]
    neurostars_tags: [aslprep]
    neurostars_search: []
    checkout_tags: 5
    neighbors: []

  xcp_d:
    github_repo: PennLINC/xcp_d
    blurb: "Post-processing & denoising of fMRIPrep BOLD derivatives."
    docs_paths: [docs/]
    # Community tags under xcp_d (~176); xcpd/xcp-d are minor variants. Do NOT
    # add `xcpengine` — that's the deprecated predecessor, different software.
    neurostars_tags: [xcp_d, xcpd, xcp-d]
    neurostars_search: []
    checkout_tags: 5
    neighbors: []                 # consumes fMRIPrep derivatives, not in our set
    notes:
      - "XCP-D (xcp_d) is the current post-processing / denoising tool for
        fMRIPrep BOLD derivatives, and the successor to the deprecated
        xcpEngine. Point xcpEngine questions to the XCP-D equivalent."

  # ModelArray (R stats) + ModelArrayIO (Python HDF5 converter) are two halves
  # of one workflow — presented as a single "modelarray" tool. ModelArrayIO is
  # `hidden` (no card) but rides in via neighbor scoping so its docs/issues are
  # retrievable. Neither has NeuroStars threads.
  modelarray:
    github_repo: PennLINC/ModelArray
    blurb: "Mass-univariate statistical analysis of fixel-wise (and other) data."
    docs_paths: [vignettes/]        # R package docs are .Rmd vignettes, not docs/
    neurostars_tags: []
    neurostars_search: []
    checkout_tags: 5
    neighbors: [modelarrayio]

  modelarrayio:
    github_repo: PennLINC/ModelArrayIO
    docs_paths: [docs/]
    neurostars_tags: []
    neurostars_search: []
    checkout_tags: 5
    neighbors: [modelarray]
    hidden: true                    # part of the ModelArray tool, not its own card

  cubids:
    github_repo: PennLINC/CuBIDS
    blurb: "Curation & validation of BIDS datasets."
    docs_paths: [docs/]
    neurostars_tags: [cubids]        # thin (~2 topics); the corpus is its issues
    neurostars_search: []
    checkout_tags: 5
    neighbors: []

  # Add more the same way (config, not code) — e.g. freesurfer-post once it has
  # more of its own issue/doc signal. Probe each first (probes/) for tag health.

retrieval:
  top_k: 8                         # wider than linc-llm; answers run longer
  candidates: 40                   # hybrid pool per side before rank fusion
  embed_model: BAAI/bge-small-en-v1.5   # pinned; MUST match ingest and query

chunk:
  size_tokens: 500                 # linc-llm production values
  overlap_tokens: 75

llm:
  oneshot_model: gpt-5.4-mini      # FAQ-shaped path
  agent_model: gpt-5.6-terra       # tool loop over tracebacks justifies mid-tier
  max_output_tokens: 2500
  max_tool_iterations: 12
  # Hard in-app daily spend ceiling (UTC), the ONLY hard cost backstop — no
  # provider-side cap is available (OpenAI key limits unavailable; project caps
  # are soft/email-only). Set high for the internal test phase; lower later.
  daily_budget_usd: 300
  pricing:                         # $ per 1M tokens (short-context); update when rates change
    gpt-5.4-mini: {input: 0.75, output: 4.50}
    gpt-5.6-terra: {input: 2.00, output: 12.00}

index:
  path: ./index                    # chroma + fts.sqlite + manifest.json (gitignored)

checkouts:
  path: ./checkouts                # shallow clones per app per tag (gitignored)

feedback:
  # owner/repo for the "Report this answer" button in the UI (prefilled GitHub
  # issue). Leave empty to hide the button.
  github_repo: PennLINC/linc-bids-llm
