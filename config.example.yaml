# Copy to config.yaml and adjust. config.yaml is gitignored; this file is the
# committed template. Expanding to another BIDS App = adding an entry under
# `apps` and re-ingesting — configuration, not code.

contact_email: you@example.edu     # goes in the crawl User-Agent (be reachable)

apps:
  qsiprep:
    github_repo: PennLINC/qsiprep
    docs_paths: [docs/]            # within the repo; rendered RTD not needed
    neurostars_tags: [qsiprep]
    neurostars_search: []          # extra search terms if tagging is spotty
    checkout_tags: 3               # latest N release tags + main
    neighbors: [qsirecon]          # pipeline neighbors, retrieved alongside
    # `notes` correct known confusions the corpus/model gets wrong; they're
    # injected into the system prompt whenever this app is in scope.
    notes:
      - "qsiprep does DWI PREPROCESSING only. Reconstruction (tractography,
        scalar/ODF maps, connectivity) moved to the separate qsirecon package;
        current qsiprep does NOT do reconstruction and has no --recon-spec /
        --recon_input. A recon_spec.yaml is passed to qsirecon, not qsiprep.
        Send reconstruction/post-processing questions to qsirecon."

  qsirecon:
    github_repo: PennLINC/qsirecon
    docs_paths: [docs/]
    neurostars_tags: [qsirecon]
    neurostars_search: []
    checkout_tags: 3
    neighbors: [qsiprep]           # takes qsiprep's preprocessed outputs as input
    notes:
      - "qsirecon does RECONSTRUCTION / post-processing of qsiprep outputs
        (tractography, scalar maps, connectivity). It is the successor to
        qsiprep's old built-in --recon functionality; recon_spec.yaml and
        --recon-spec belong here, not in qsiprep."

  # Add more the same way (config, not code) — e.g. aslprep, xcp-d, cubids,
  # freesurfer-post, modelarray. Probe each first (probes/) for tag health.

retrieval:
  top_k: 8                         # wider than linc-llm; answers run longer
  candidates: 40                   # hybrid pool per side before rank fusion
  embed_model: BAAI/bge-small-en-v1.5   # pinned; MUST match ingest and query

chunk:
  size_tokens: 500                 # linc-llm production values
  overlap_tokens: 75

llm:
  oneshot_model: gpt-5.4-mini      # FAQ-shaped path
  agent_model: gpt-5.6-terra       # tool loop over tracebacks justifies mid-tier
  max_output_tokens: 2500
  max_tool_iterations: 12
  # Hard in-app daily spend ceiling (UTC), the ONLY hard cost backstop — no
  # provider-side cap is available (OpenAI key limits unavailable; project caps
  # are soft/email-only). Set high for the internal test phase; lower later.
  daily_budget_usd: 300
  pricing:                         # $ per 1M tokens (short-context); update when rates change
    gpt-5.4-mini: {input: 0.75, output: 4.50}
    gpt-5.6-terra: {input: 2.00, output: 12.00}

index:
  path: ./index                    # chroma + fts.sqlite + manifest.json (gitignored)

checkouts:
  path: ./checkouts                # shallow clones per app per tag (gitignored)

feedback:
  # owner/repo for the "Report this answer" button in the UI (prefilled GitHub
  # issue). Leave empty to hide the button.
  github_repo: PennLINC/linc-bids-llm
